# Lint and tests on GitHub; a v* tag also publishes ghcr.io/<owner>/ente-admin:<version> and
# <version>-pg (with the postgres source). .forgejo/workflows/ci.yaml does the same on
# Forgejo with BuildKit.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev,postgres]'
      - run: ruff check .
      - run: pytest -q

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - extras: ""
            suffix: ""
          - extras: postgres
            suffix: "-pg"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: name
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: EXTRAS=${{ matrix.extras }}
          push: true
          tags: ${{ steps.name.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
